<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Cursos | Javali</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
      }
      header {
        background: #17324d;
        color: white;
        padding: 18px 28px;
      }
      nav {
        display: flex;
        gap: 18px;
      }
      nav a {
        color: white;
        text-decoration: none;
      }
      main {
        max-width: 900px;
        margin: 40px auto;
        padding: 24px;
      }
      .curso {
        margin-bottom: 18px;
        padding: 22px;
        background: white;
        border-left: 6px solid #087e8b;
        border-radius: 10px;
        box-shadow: 0 5px 16px rgba(0, 0, 0, 0.07);
      }
      .activo {
        color: #147d3f;
        font-weight: bold;
      }
      .inactivo {
        color: #a12828;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <header>
      <nav>
        <strong>Javali</strong>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/web/cursos}">Cursos</a>
        <a th:href="@{/login}">Iniciar sesión</a>
      </nav>
    </header>

    <main>
      <h1>Cursos disponibles</h1>
      <p th:if="${#lists.isEmpty(cursos)}">
        Todavía no hay cursos disponibles.
      </p>
      <article class="curso" th:each="curso : ${cursos}">
        <h2 th:text="${curso.titulo}">Título del curso</h2>
        <p th:text="${curso.descripcion}">Descripción del curso</p>
        <p class="activo" th:if="${curso.activo}">Disponible</p>
        <p class="inactivo" th:if="${!curso.activo}">No disponible</p>
        <a
          th:if="${curso.activo}"
          th:href="@{/web/cursos/{id}/unidades(id=${curso.id})}"
        >
          Ver unidades
        </a>
      </article>
    </main>
  </body>
</html>
