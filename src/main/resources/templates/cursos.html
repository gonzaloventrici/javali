<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  th:data-tamano="${preferencias?.tamanoLetra}"
  th:data-contraste="${preferencias?.contraste}"
  th:data-tipografia="${preferencias?.tipografia}"
>
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Cursos | Javali</title>

    <link rel="stylesheet" th:href="@{/css/javali.css}" />
    <script th:src="@{/js/javali.js}" defer></script>
  </head>

  <body>
    <div th:replace="~{fragments/menu :: menu}"></div>

    <main id="contenido">
      <h1>Cursos disponibles</h1>

      <p th:if="${#lists.isEmpty(cursos)}">
        Todavía no hay cursos disponibles.
      </p>

      <article
        class="curso"
        th:each="curso : ${cursos}"
        th:with="estado=${avance[curso.id]}"
        th:classappend="${estado != null and estado.completado} ? 'completado'"
      >
        <h2 th:text="${curso.titulo}">Título del curso</h2>

        <p th:text="${curso.descripcion}">Descripción del curso</p>

        <p class="insignia insignia-completado" th:if="${estado != null and estado.completado}">
          <span aria-hidden="true">✔</span> Curso completado
        </p>

        <p class="activo" th:if="${curso.activo and (estado == null or !estado.completado)}">
          Disponible
        </p>

        <p class="inactivo" th:if="${!curso.activo}">No disponible</p>

        <div th:if="${estado != null and estado.leccionesTotales > 0}">
          <p
            th:id="${'avance-curso-' + curso.id}"
            th:text="${estado.leccionesCompletadas + ' de '
                    + estado.leccionesTotales + ' lecciones completadas · '
                    + estado.unidadesCompletadas + ' de '
                    + estado.unidadesTotales + ' unidades'}"
          >
            2 de 4 lecciones completadas · 1 de 2 unidades
          </p>

          <progress
            th:max="${estado.leccionesTotales}"
            th:value="${estado.leccionesCompletadas}"
            th:attr="aria-labelledby=${'avance-curso-' + curso.id}"
          ></progress>
        </div>

        <a
          class="boton"
          th:if="${curso.activo}"
          th:href="@{/web/cursos/{id}/unidades(id=${curso.id})}"
          th:text="${estado != null and estado.completado
                    ? 'Repasar unidades'
                    : (estado != null and estado.leccionesCompletadas > 0
                        ? 'Continuar'
                        : 'Ver unidades')}"
        >
          Ver unidades
        </a>
      </article>
    </main>
  </body>
</html>
