<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  th:data-tamano="${preferencias?.tamanoLetra}"
  th:data-contraste="${preferencias?.contraste}"
  th:data-tipografia="${preferencias?.tipografia}"
>
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Resultado de evaluación | Javali</title>

    <link rel="stylesheet" th:href="@{/css/javali.css}" />
    <script th:src="@{/js/javali.js}" defer></script>
  </head>

  <body>
    <div th:replace="~{fragments/menu :: menu}"></div>

    <main id="contenido">
      <h1>Resultado de la evaluación</h1>

      <p>
        Respuestas correctas:

        <strong
          th:text="${evaluacion.respuestasCorrectas
                + ' de '
                + evaluacion.totalPreguntas}"
        >
          8 de 12
        </strong>
      </p>

      <p>
        Puntaje (las preguntas difíciles valen más):

        <strong
          th:text="${#numbers.formatDecimal(
                evaluacion.porcentaje,
                1,
                2
        ) + '%'}"
        >
          80%
        </strong>
      </p>

      <section class="nivel-recomendado">
        <h2>Nivel recomendado</h2>

        <strong th:text="${evaluacion.nivelRecomendado}"> AVANZADO </strong>
      </section>

      <form
        th:action="@{/web/evaluaciones/{id}/nivel(
                id=${evaluacion.id}
          )}"
        method="post"
      >
        <label for="nivelElegido">
          Elegí el nivel con el que querés continuar
        </label>

        <select id="nivelElegido" name="nivelElegido" required>
          <option value="">Seleccioná un nivel</option>

          <option
            th:each="nivel : ${niveles}"
            th:value="${nivel}"
            th:text="${nivel}"
            th:selected="${nivel
                            == evaluacion.nivelRecomendado}"
          >
            INICIAL
          </option>
        </select>

        <button class="boton" type="submit">Guardar nivel y continuar</button>
      </form>
    </main>
  </body>
</html>
