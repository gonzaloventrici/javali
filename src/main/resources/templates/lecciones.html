<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  th:data-tamano="${preferencias?.tamanoLetra}"
  th:data-contraste="${preferencias?.contraste}"
  th:data-tipografia="${preferencias?.tipografia}"
>
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Lecciones | Javali</title>

    <link rel="stylesheet" th:href="@{/css/javali.css}" />
    <script th:src="@{/js/javali.js}" defer></script>
  </head>

  <body>
    <div th:replace="~{fragments/menu :: menu}"></div>

    <main id="contenido">
      <a
        class="volver"
        th:href="@{/web/cursos/{id}/unidades(id=${unidad.cursoId})}"
      >
        Volver a unidades
      </a>

      <h1 th:text="${unidad.titulo}">Nombre de la unidad</h1>

      <p th:text="${unidad.descripcion}">Descripción de la unidad</p>

      <p class="aviso" role="status" th:if="${avisoBloqueo != null}" th:text="${avisoBloqueo}">
        Esa lección todavía está bloqueada.
      </p>

      <h2>Lecciones</h2>

      <p th:if="${#lists.isEmpty(lecciones)}">
        Esta unidad todavía no tiene lecciones.
      </p>

      <article
        class="leccion"
        th:each="leccion : ${lecciones}"
        th:with="estado=${avanceLecciones[leccion.id]}"
        th:classappend="${estado == null} ? ''
            : (${estado.completada} ? 'completado'
              : (${!estado.desbloqueada} ? 'bloqueado' : ''))"
      >
        <h3 th:text="${leccion.orden + '. ' + leccion.titulo}">
          1. Nombre de la lección
        </h3>

        <p class="insignia insignia-completado"
           th:if="${estado != null and estado.completada}">
          <span aria-hidden="true">✔</span> Completada
        </p>

        <p class="insignia insignia-bloqueado"
           th:if="${estado != null and !estado.desbloqueada}">
          <span aria-hidden="true">🔒</span> Bloqueada
        </p>

        <p th:text="${leccion.explicacion}">Explicación de la lección</p>

        <p class="ayuda" th:if="${estado != null and !estado.desbloqueada}">
          Completá la lección anterior para abrirla.
        </p>

        <a
          class="boton"
          th:if="${estado == null or estado.desbloqueada}"
          th:href="@{/web/lecciones/{id}/ejercicios(id=${leccion.id})}"
          th:text="${estado != null and estado.completada
                    ? 'Repasar ejercicios'
                    : 'Ver ejercicios'}"
        >
          Ver ejercicios
        </a>
      </article>
    </main>
  </body>
</html>
