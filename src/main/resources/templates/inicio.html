<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Javali</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
      }
      header {
        background: #17324d;
        color: white;
        padding: 18px 28px;
      }
      nav {
        display: flex;
        gap: 18px;
        align-items: center;
      }
      nav a {
        color: white;
        text-decoration: none;
      }
      main {
        max-width: 900px;
        margin: 48px auto;
        padding: 32px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      }
      h1 {
        color: #17324d;
      }
      .boton {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 18px;
        border-radius: 8px;
        background: #087e8b;
        color: white;
        text-decoration: none;
      }
      .usuario {
        margin-top: 20px;
        padding: 14px;
        background: #e8f4f5;
        border-radius: 8px;
      }
      .boton-registro {
        padding: 9px 14px;
        border-radius: 8px;
        background: #087e8b;
        color: white;
        text-decoration: none;
      }
      .boton-registro:hover {
        background: #066975;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <header>
      <nav>
        <strong>Javali</strong>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/web/cursos}">Cursos</a>

        <a th:if="${!autenticado}" th:href="@{/login}"> Iniciar sesión </a>

        <a
          class="boton-registro"
          th:if="${!autenticado}"
          th:href="@{/registro}"
        >
          Registrarse
        </a>

        <form th:if="${autenticado}" th:action="@{/logout}" method="post">
          <button type="submit">Cerrar sesión</button>
        </form>

        <a th:if="${autenticado}" th:href="@{/web/mi-progreso}">
          Mi progreso
        </a>
      </nav>
    </header>

    <main>
      <h1>Aprendé Java con Javali</h1>

      <p>
        Javali permite recorrer cursos, resolver ejercicios, identificar tipos
        de error y consultar el progreso de aprendizaje.
      </p>

      <a class="boton" th:href="@{/web/cursos}"> Ver cursos </a>

      <div class="usuario" th:if="${autenticado}">
        Sesión iniciada como:

        <strong th:text="${emailUsuario}"> usuario@javali.com </strong>
      </div>
    </main>
  </body>
</html>
