<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Registro | Javali</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
      }

      header {
        background: #17324d;
        color: white;
        padding: 18px 28px;
      }

      nav {
        display: flex;
        gap: 18px;
        align-items: center;
      }

      nav strong {
        margin-right: 8px;
      }

      nav a {
        color: white;
        text-decoration: none;
      }

      nav a:hover {
        text-decoration: underline;
      }

      nav span {
        margin-left: auto;
      }

      .form-logout {
        margin: 0;
      }

      .form-logout button {
        width: auto;
        margin: 0;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #087e8b;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }

      .form-logout button:hover {
        background: #066975;
      }

      main {
        max-width: 500px;
        margin: 48px auto;
        padding: 32px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        color: #17324d;
      }

      .campo {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        border: 1px solid #b8c2cc;
        border-radius: 6px;
        font-size: 16px;
      }

      input:focus {
        border-color: #087e8b;
        outline: none;
      }

      .boton-crear {
        width: 100%;
        padding: 12px 18px;
        border: none;
        border-radius: 8px;
        background: #087e8b;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      .boton-crear:hover {
        background: #066975;
      }

      .error {
        margin-top: 6px;
        color: #a12828;
        font-size: 14px;
      }

      .ayuda {
        margin-top: 6px;
        color: #5d6875;
        font-size: 14px;
      }

      .login {
        margin-top: 22px;
        text-align: center;
      }

      .login a {
        color: #087e8b;
      }

      .login a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div th:replace="~{fragments/menu :: menu}"></div>

    <main>
      <h1>Crear una cuenta</h1>

      <p>Registrate para resolver ejercicios y consultar tu progreso.</p>

      <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <div class="campo">
          <label for="nombre"> Nombre </label>

          <input
            id="nombre"
            type="text"
            th:field="*{nombre}"
            placeholder="Ingresá tu nombre"
            autocomplete="name"
            required
          />

          <p
            class="error"
            th:if="${#fields.hasErrors('nombre')}"
            th:errors="*{nombre}"
          >
            El nombre no es válido.
          </p>
        </div>

        <div class="campo">
          <label for="email"> Email </label>

          <input
            id="email"
            type="email"
            th:field="*{email}"
            placeholder="nombre@correo.com"
            autocomplete="email"
            required
          />

          <p
            class="error"
            th:if="${#fields.hasErrors('email')}"
            th:errors="*{email}"
          >
            El email no es válido.
          </p>

          <p class="error" th:if="${errorEmail}" th:text="${errorEmail}">
            El email ya está registrado.
          </p>
        </div>

        <div class="campo">
          <label for="password"> Contraseña </label>

          <input
            id="password"
            type="password"
            th:field="*{password}"
            placeholder="Mínimo 8 caracteres"
            autocomplete="new-password"
            minlength="8"
            maxlength="100"
            required
          />

          <p
            class="error"
            th:if="${#fields.hasErrors('password')}"
            th:errors="*{password}"
          >
            La contraseña no es válida.
          </p>

          <p class="ayuda">
            La contraseña debe tener entre 8 y 100 caracteres.
          </p>
        </div>

        <button class="boton-crear" type="submit">Crear cuenta</button>
      </form>

      <p class="login">
        ¿Ya tenés una cuenta?

        <a th:href="@{/login}"> Iniciar sesión </a>
      </p>
    </main>
  </body>
</html>
