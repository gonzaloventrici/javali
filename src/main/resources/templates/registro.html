<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  th:data-tamano="${preferencias?.tamanoLetra}"
  th:data-contraste="${preferencias?.contraste}"
  th:data-tipografia="${preferencias?.tipografia}"
>
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Registro | Javali</title>

    <link rel="stylesheet" th:href="@{/css/javali.css}" />
    <script th:src="@{/js/javali.js}" defer></script>
  </head>

  <body>
    <div th:replace="~{fragments/menu :: menu}"></div>

    <main id="contenido">
      <h1>Crear una cuenta</h1>

      <p>Registrate para resolver ejercicios y consultar tu progreso.</p>

      <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <div class="campo">
          <label for="nombre"> Nombre </label>

          <input
            id="nombre"
            type="text"
            th:field="*{nombre}"
            placeholder="Ingresá tu nombre"
            autocomplete="name"
            required
          />

          <p
            class="error"
            th:if="${#fields.hasErrors('nombre')}"
            th:errors="*{nombre}"
          >
            El nombre no es válido.
          </p>
        </div>

        <div class="campo">
          <label for="email"> Email </label>

          <input
            id="email"
            type="email"
            th:field="*{email}"
            placeholder="nombre@correo.com"
            autocomplete="email"
            required
          />

          <p
            class="error"
            th:if="${#fields.hasErrors('email')}"
            th:errors="*{email}"
          >
            El email no es válido.
          </p>

          <p class="error" th:if="${errorEmail}" th:text="${errorEmail}">
            El email ya está registrado.
          </p>
        </div>

        <div class="campo">
          <label for="password"> Contraseña </label>

          <input
            id="password"
            type="password"
            th:field="*{password}"
            placeholder="Mínimo 8 caracteres"
            autocomplete="new-password"
            minlength="8"
            maxlength="100"
            required
          />

          <p
            class="error"
            th:if="${#fields.hasErrors('password')}"
            th:errors="*{password}"
          >
            La contraseña no es válida.
          </p>

          <p class="ayuda">
            La contraseña debe tener entre 8 y 100 caracteres.
          </p>
        </div>

        <button class="boton-crear" type="submit">Crear cuenta</button>
      </form>

      <p class="login">
        ¿Ya tenés una cuenta?

        <a th:href="@{/login}"> Iniciar sesión </a>
      </p>
    </main>
  </body>
</html>
