<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <body>
    <header th:fragment="menu">
      <a class="saltar" href="#contenido">Saltar al contenido</a>

      <nav aria-label="Navegación principal">
        <strong>Javali</strong>

        <a th:href="@{/}"> Inicio </a>

        <a th:href="@{/web/cursos}"> Cursos </a>

        <a th:if="${evaluacionPendiente}" th:href="@{/web/evaluacion}">
          Evaluación inicial
        </a>

        <a th:if="${autenticado}" th:href="@{/web/mi-progreso}">
          Mi progreso
        </a>

        <a th:if="${autenticado}" th:href="@{/web/preferencias}">
          Accesibilidad
        </a>

        <span
          class="racha"
          th:if="${racha != null}"
          th:title="${'Mejor racha: ' + racha.mejorRacha}"
          th:text="${'Racha: ' + racha.rachaActual
                    + (racha.rachaActual == 1 ? ' día' : ' días')}"
        >
          Racha: 3 días
        </span>

        <span
          class="usuario-menu"
          th:if="${autenticado}"
          th:text="${emailUsuario}"
        >
          usuario@javali.com
        </span>

        <a th:if="${!autenticado}" th:href="@{/login}"> Iniciar sesión </a>

        <a th:if="${!autenticado}" th:href="@{/registro}"> Registrarse </a>

        <form
          th:if="${autenticado}"
          th:action="@{/logout}"
          method="post"
          class="form-logout"
        >
          <button type="submit">Cerrar sesión</button>
        </form>
      </nav>
    </header>
  </body>
</html>
