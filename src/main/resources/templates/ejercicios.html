<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  th:data-tamano="${preferencias?.tamanoLetra}"
  th:data-contraste="${preferencias?.contraste}"
  th:data-tipografia="${preferencias?.tipografia}"
>
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Ejercicios | Javali</title>

    <link rel="stylesheet" th:href="@{/css/javali.css}" />
    <script th:src="@{/js/javali.js}" defer></script>
  </head>

  <body>
    <div th:replace="~{fragments/menu :: menu}"></div>

    <main id="contenido">
      <a
        class="volver"
        th:href="@{/web/unidades/{id}/lecciones(
            id=${leccion.unidadId}
       )}"
      >
        Volver a lecciones
      </a>

      <h1 th:text="${leccion.titulo}">Nombre de la lección</h1>

      <p th:text="${leccion.explicacion}">Explicación de la lección</p>

      <h2>Ejercicios</h2>

      <p th:if="${#lists.isEmpty(ejercicios)}">
        Esta lección todavía no tiene ejercicios.
      </p>

      <article class="ejercicio" th:each="ejercicio : ${ejercicios}">
        <p class="tipo" th:text="${ejercicio.tipo}">OPCIONES</p>

        <h3
          th:text="${ejercicio.orden
                + '. '
                + ejercicio.enunciado}"
        >
          1. Enunciado del ejercicio
        </h3>

        <pre
          th:if="${ejercicio.codigo != null
                and !ejercicio.codigo.isBlank()}"
          th:text="${ejercicio.codigo}"
        >
Código del ejercicio</pre
        >

        <p>
          Cantidad de opciones:

          <strong
            th:text="${#lists.size(
                    ejercicio.opciones
            )}"
          >
            3
          </strong>
        </p>

        <a
          class="boton"
          th:href="@{/web/ejercicios/{id}(
                id=${ejercicio.id}
           )}"
        >
          Resolver ejercicio
        </a>
      </article>
    </main>
  </body>
</html>
