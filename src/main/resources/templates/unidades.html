<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Unidades | Javali</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
      }
      header {
        background: #17324d;
        color: white;
        padding: 18px 28px;
      }
      nav {
        display: flex;
        gap: 18px;
        align-items: center;
      }
      nav a {
        color: white;
        text-decoration: none;
      }
      nav a:hover {
        text-decoration: underline;
      }
      main {
        max-width: 900px;
        margin: 40px auto;
        padding: 24px;
      }
      h1 {
        color: #17324d;
      }
      .unidad {
        margin-bottom: 18px;
        padding: 22px;
        background: white;
        border-left: 6px solid #087e8b;
        border-radius: 10px;
        box-shadow: 0 5px 16px rgba(0, 0, 0, 0.07);
      }
      .boton {
        display: inline-block;
        padding: 9px 14px;
        border-radius: 8px;
        background: #087e8b;
        color: white;
        text-decoration: none;
      }
      .boton:hover {
        background: #066975;
      }
      .volver {
        display: inline-block;
        margin-bottom: 20px;
        color: #087e8b;
      }
    </style>
  </head>

  <body>
    <header>
      <nav>
        <strong>Javali</strong>

        <a th:href="@{/}"> Inicio </a>

        <a th:href="@{/web/cursos}"> Cursos </a>

        <a th:href="@{/login}"> Iniciar sesión </a>

        <a th:href="@{/registro}"> Registrarse </a>
      </nav>
    </header>

    <main>
      <a class="volver" th:href="@{/web/cursos}"> Volver a cursos </a>

      <h1 th:text="${curso.titulo}">Nombre del curso</h1>

      <p th:text="${curso.descripcion}">Descripción del curso</p>

      <h2>Unidades</h2>

      <p th:if="${#lists.isEmpty(unidades)}">
        Este curso todavía no tiene unidades.
      </p>

      <article class="unidad" th:each="unidad : ${unidades}">
        <h3 th:text="${unidad.orden + '. ' + unidad.titulo}">
          1. Nombre de la unidad
        </h3>

        <p th:text="${unidad.descripcion}">Descripción de la unidad</p>

        <a
          class="boton"
          th:href="@{/web/unidades/{id}/lecciones(id=${unidad.id})}"
        >
          Ver lecciones
        </a>
      </article>
    </main>
  </body>
</html>
