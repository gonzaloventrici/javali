<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  th:data-tamano="${preferencias?.tamanoLetra}"
  th:data-contraste="${preferencias?.contraste}"
  th:data-tipografia="${preferencias?.tipografia}"
>
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Registro exitoso | Javali</title>

    <link rel="stylesheet" th:href="@{/css/javali.css}" />
    <script th:src="@{/js/javali.js}" defer></script>
  </head>

  <body>
    <div th:replace="~{fragments/menu :: menu}"></div>

    <main id="contenido">
      <h1>Registro exitoso</h1>

      <div class="mensaje">Usuario registrado correctamente.</div>

      <p>Ya podés iniciar sesión con tu email y contraseña.</p>

      <a class="boton" th:href="@{/login}"> Ir al login </a>
    </main>
  </body>
</html>
